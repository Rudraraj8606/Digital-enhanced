<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Digital Logic Simulator (Web Edition)</title>
    <script src="https://cjrtnc.leaningtech.com/2.3/loader.js"></script>
    <!-- Load Google APIs -->
    <script async defer src="https://apis.google.com/js/api.js"></script>
    <script async defer src="https://accounts.google.com/gsi/client"></script>
    <!-- Load Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #222; }
        #container { width: 100vw; height: 100vh; }
        #drive-controls { position: fixed; top: 10px; right: 10px; z-index: 1000; display: flex; gap: 10px; }
        .btn { padding: 8px 16px; background: #4285f4; color: white; border: none; cursor: pointer; font-family: sans-serif; border-radius: 4px; }
        .room-info { background: rgba(255,255,255,0.1); color: #fff; padding: 8px; font-family: monospace; border-radius: 4px; display: none; }
    </style>
</head>
<body>
    <div id="drive-controls">
        <div id="room-label" class="room-info">Room: Not Active</div>
        <button id="auth-btn" class="btn" onclick="handleAuthClick()">Sign in to Google Drive</button>
    </div>
    <div id="container"></div>

    <script>
        // --- Firebase Configuration (FREE TIER) ---
        // YOU MUST REPLACE THESE WITH YOUR OWN FIREBASE CONFIG LATER
        const firebaseConfig = {
            apiKey: "AIza...",
            authDomain: "your-project.firebaseapp.com",
            databaseURL: "https://your-project.firebaseio.com",
            projectId: "your-project",
            storageBucket: "your-project.appspot.com",
            messagingSenderId: "123",
            appId: "1:123:web:456"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        let currentRoomId = null;

        // --- Bridge Functions for Collaboration ---

        // Generate a random room ID
        function generateRoomId() {
            return Math.random().toString(36).substring(2, 8).toUpperCase();
        }

        // Called from Main.java
        window.startCollaboration = async function(xmlContent) {
            currentRoomId = generateRoomId();
            const roomRef = database.ref('rooms/' + currentRoomId);
            await roomRef.set({
                circuit: xmlContent,
                timestamp: Date.now()
            });

            // Update URL so others can join
            const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?room=' + currentRoomId;
            window.history.pushState({path:newUrl},'',newUrl);
            
            document.getElementById('room-label').innerText = 'Room: ' + currentRoomId;
            document.getElementById('room-label').style.display = 'block';
            alert("Room Created! Share this link with friends:\n" + newUrl);
        };

        // Called from Main.java
        window.syncCollaboration = async function(xmlContent) {
            if (!currentRoomId) {
                alert("No active room. Start a room first!");
                return;
            }
            const roomRef = database.ref('rooms/' + currentRoomId);
            await roomRef.update({
                circuit: xmlContent,
                timestamp: Date.now()
            });
            alert("Circuit Synced to Room!");
        };

        // Automatic Joining if ?room= exists in URL
        async function checkJoinRoom() {
            const urlParams = new URLSearchParams(window.location.search);
            const roomId = urlParams.get('room');
            if (roomId) {
                currentRoomId = roomId;
                document.getElementById('room-label').innerText = 'Room: ' + currentRoomId;
                document.getElementById('room-label').style.display = 'block';

                // Listen for changes
                const roomRef = database.ref('rooms/' + currentRoomId);
                roomRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data && data.circuit) {
                        console.log("Room data updated, reloading circuit...");
                        // In a real implementation, we would send this XML back to the Java app
                        // to refresh the screen. For now, we alert the user.
                    }
                });
            }
        }
        const CLIENT_ID = 'YOUR_GOOGLE_CLIENT_ID'; // YOU MUST REPLACE THIS
        const SCOPES = 'https://www.googleapis.com/auth/drive.file';
        let tokenClient;
        let accessToken = null;

        function handleAuthClick() {
            tokenClient.callback = async (resp) => {
                if (resp.error !== undefined) {
                    throw (resp);
                }
                accessToken = resp.access_token;
                document.getElementById('auth-btn').innerText = 'Signed in to Google Drive';
            };

            if (accessToken === null) {
                tokenClient.requestAccessToken({prompt: 'consent'});
            } else {
                tokenClient.requestAccessToken({prompt: ''});
            }
        }

        // Initialize Google API Client
        window.onload = function() {
            gapi.load('client', async () => {
                await gapi.client.init({
                    // Only scope is needed for simple file operations
                });
                await gapi.client.load('drive', 'v3');
            });

            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: '', // defined at consumption time
            });
        };

        // --- Bridge Functions for Java (CheerpJ) ---

        // Called from Main.java
        window.saveToGoogleDrive = async function(fileName, content) {
            if (!accessToken) {
                alert("Please sign in to Google Drive first.");
                return;
            }

            const metadata = {
                'name': fileName,
                'mimeType': 'application/xml',
                'parents': ['root']
            };

            const file = new Blob([content], {type: 'application/xml'});
            const form = new FormData();
            form.append('metadata', new Blob([JSON.stringify(metadata)], {type: 'application/json'}));
            form.append('file', file);

            try {
                const response = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
                    method: 'POST',
                    headers: new Headers({'Authorization': 'Bearer ' + accessToken}),
                    body: form
                });
                const result = await response.json();
                alert("Saved to Google Drive: " + result.name);
            } catch (err) {
                alert("Error saving to Drive: " + err);
            }
        };

        // Called from Main.java
        window.openFromGoogleDrive = async function() {
            if (!accessToken) {
                alert("Please sign in to Google Drive first.");
                return;
            }

            // Simple File Picker - for a professional app, use Google Picker API
            const response = await gapi.client.drive.files.list({
                q: "mimeType='application/xml' and name contains '.dig'",
                fields: 'files(id, name)'
            });
            const files = response.result.files;
            if (files.length === 0) {
                alert("No .dig files found in your Google Drive.");
                return;
            }

            // For now, let's just pick the first one as a demo
            // In a real app, you would show a list to the user
            const fileId = files[0].id;
            const fileContent = await gapi.client.drive.files.get({
                fileId: fileId,
                alt: 'media'
            });

            // Send the content BACK to the Java app
            // We can do this by creating a temporary file in CheerpJ's virtual filesystem
            const virtualPath = "/str/opened_circuit.dig";
            // We use cheerpj's filesystem interop if available or 
            // trigger a reload with a parameter
            alert("Loading: " + files[0].name);
            // In CheerpJ 2.x, we can't easily write to the virtual FS from outside
            // except via specialized APIs or re-running main with arguments.
            // A common pattern is to use a custom Java class to bridge.
        };

        // --- CheerpJ Launcher ---
        async function loadDigital() {
            await cheerpjInit();
            const container = document.getElementById('container');
            cheerpjCreateDisplay(window.innerWidth, window.innerHeight, container);
            // Check for room joining
            await checkJoinRoom();
            // Start the application
            await cheerpjRunMain("de.neemann.digital.gui.Main", "/app/Digital.jar");
        }
        loadDigital();
    </script>
</body>
</html>
