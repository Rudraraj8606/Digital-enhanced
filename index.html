<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Digital Logic Simulator (Web Edition)</title>
    <script src="https://cjrtnc.leaningtech.com/2.3/loader.js"></script>
    <!-- Load Google APIs -->
    <script async defer src="https://apis.google.com/js/api.js"></script>
    <script async defer src="https://accounts.google.com/gsi/client"></script>
    <!-- Load Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #1a1a1a; color: #00ff41; font-family: 'Courier New', Courier, monospace; }
        #container { width: 100vw; height: 100vh; display: none; }
        
        /* Interesting Loader Styles */
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
            z-index: 9999;
        }
        .circuit-loader { text-align: center; }
        .waveform { width: 200px; fill: none; stroke: #00ff41; stroke-width: 2; margin-bottom: 20px; }
        .trace {
            stroke-dasharray: 1000; stroke-dashoffset: 1000;
            animation: dash 3s linear infinite;
        }
        @keyframes dash { to { stroke-dashoffset: 0; } }
        #status-msg { font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; min-height: 1.5em; }
        .binary-stream { font-size: 0.8rem; opacity: 0.5; overflow: hidden; width: 300px; margin: 0 auto; white-space: nowrap; }

        #drive-controls { position: fixed; top: 10px; right: 10px; z-index: 1000; display: flex; gap: 10px; }
        .btn { padding: 8px 16px; background: #4285f4; color: white; border: none; cursor: pointer; font-family: sans-serif; border-radius: 4px; }
        .room-info { background: rgba(255,255,255,0.1); color: #fff; padding: 8px; font-family: monospace; border-radius: 4px; display: none; }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="circuit-loader">
            <svg viewBox="0 0 100 40" class="waveform">
                <polyline points="0,35 10,35 10,5 30,5 30,35 50,35 50,5 70,5 70,35 90,35 100,35" class="trace" />
            </svg>
            <div id="status-msg">Initializing Logic Engine...</div>
            <div class="binary-stream" id="binary-text">01011010...</div>
        </div>
    </div>

    <div id="drive-controls">
        <div id="room-label" class="room-info">Room: Not Active</div>
        <button id="auth-btn" class="btn" onclick="handleAuthClick()">Sign in to Google Drive</button>
    </div>
    <div id="container"></div>

    <script>
        // --- Loading Screen Logic ---
        const messages = [
            "Charging Capacitors...",
            "Routing Copper Traces...",
            "Optimizing Gate Propagation...",
            "Validating Truth Tables...",
            "Initializing Flip-Flops...",
            "Synchronizing Clock Cycles...",
            "Applying Voltage...",
            "Finalizing Integrated Circuits..."
        ];
        let msgIndex = 0;
        setInterval(() => {
            const el = document.getElementById('status-msg');
            if (el) {
                el.innerText = messages[msgIndex % messages.length];
                msgIndex++;
            }
        }, 3000);

        setInterval(() => {
            const el = document.getElementById('binary-text');
            if (el) {
                let b = "";
                for(let i=0; i<40; i++) b += Math.round(Math.random());
                el.innerText = b;
            }
        }, 100);

        // --- Firebase Configuration (FREE TIER) ---
        // YOU MUST REPLACE THESE WITH YOUR OWN FIREBASE CONFIG LATER
        const firebaseConfig = {
            apiKey: "AIza...",
            authDomain: "your-project.firebaseapp.com",
            databaseURL: "https://your-project.firebaseio.com",
            projectId: "your-project",
            storageBucket: "your-project.appspot.com",
            messagingSenderId: "123",
            appId: "1:123:web:456"
        };
        if (firebaseConfig.apiKey !== "AIza...") {
            firebase.initializeApp(firebaseConfig);
        }
        
        let database = null;
        try { database = firebase.database(); } catch(e) {}
        let currentRoomId = null;

        // --- Bridge Functions for Collaboration ---
        function generateRoomId() {
            return Math.random().toString(36).substring(2, 8).toUpperCase();
        }

        window.startCollaboration = async function(xmlContent) {
            if (!database) { alert("Firebase not configured."); return; }
            currentRoomId = generateRoomId();
            const roomRef = database.ref('rooms/' + currentRoomId);
            await roomRef.set({
                circuit: xmlContent,
                timestamp: Date.now()
            });
            const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?room=' + currentRoomId;
            window.history.pushState({path:newUrl},'',newUrl);
            document.getElementById('room-label').innerText = 'Room: ' + currentRoomId;
            document.getElementById('room-label').style.display = 'block';
            alert("Room Created! Share this link with friends:\n" + newUrl);
        };

        window.syncCollaboration = async function(xmlContent) {
            if (!database || !currentRoomId) { alert("No active room."); return; }
            const roomRef = database.ref('rooms/' + currentRoomId);
            await roomRef.update({
                circuit: xmlContent,
                timestamp: Date.now()
            });
            alert("Circuit Synced to Room!");
        };

        async function checkJoinRoom() {
            if (!database) return;
            const urlParams = new URLSearchParams(window.location.search);
            const roomId = urlParams.get('room');
            if (roomId) {
                currentRoomId = roomId;
                document.getElementById('room-label').innerText = 'Room: ' + currentRoomId;
                document.getElementById('room-label').style.display = 'block';
                const roomRef = database.ref('rooms/' + currentRoomId);
                roomRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data && data.circuit) {
                        console.log("Room updated");
                    }
                });
            }
        }

        // --- Google Drive Logic ---
        const CLIENT_ID = 'YOUR_GOOGLE_CLIENT_ID';
        const SCOPES = 'https://www.googleapis.com/auth/drive.file';
        let tokenClient;
        let accessToken = null;

        function handleAuthClick() {
            if (!tokenClient) { alert("Google API not loaded yet."); return; }
            tokenClient.callback = async (resp) => {
                if (resp.error !== undefined) throw (resp);
                accessToken = resp.access_token;
                document.getElementById('auth-btn').innerText = 'Signed in to Drive';
            };
            tokenClient.requestAccessToken({prompt: accessToken === null ? 'consent' : ''});
        }

        window.onload = function() {
            if (typeof gapi !== 'undefined') {
                gapi.load('client', async () => {
                    await gapi.client.init({});
                    await gapi.client.load('drive', 'v3');
                });
            }
            if (typeof google !== 'undefined') {
                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: CLIENT_ID,
                    scope: SCOPES,
                    callback: '',
                });
            }
        };

        window.saveToGoogleDrive = async function(fileName, content) {
            if (!accessToken) { alert("Please sign in first."); return; }
            const metadata = { 'name': fileName, 'mimeType': 'application/xml', 'parents': ['root'] };
            const file = new Blob([content], {type: 'application/xml'});
            const form = new FormData();
            form.append('metadata', new Blob([JSON.stringify(metadata)], {type: 'application/json'}));
            form.append('file', file);
            try {
                const response = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
                    method: 'POST',
                    headers: new Headers({'Authorization': 'Bearer ' + accessToken}),
                    body: form
                });
                const result = await response.json();
                alert("Saved: " + result.name);
            } catch (err) { alert("Error: " + err); }
        };

        window.openFromGoogleDrive = async function() {
            alert("To open, use the Google Drive UI to select a .dig file (Feature in progress)");
        };

        // --- CheerpJ Launcher ---
        async function loadDigital() {
            await cheerpjInit();
            const container = document.getElementById('container');
            cheerpjCreateDisplay(window.innerWidth, window.innerHeight, container);
            await checkJoinRoom();
            try {
                await cheerpjRunMain("de.neemann.digital.gui.Main", "/app/Digital.jar");
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('container').style.display = 'block';
            } catch(e) {
                document.getElementById('status-msg').innerText = "ERROR: Circuit Breaker Tripped!";
            }
        }
        loadDigital();
    </script>
</body>
</html>
